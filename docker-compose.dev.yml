name: next-app-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: next-app:dev
    container_name: next_web_dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      # Mount کردن سورس کد برای Hot Reload
      - .:/app
      # محافظت از node_modules داخل کانتینر
      - /app/node_modules
      # (اختیاری) برای Turbopack
      - /app/.next
    restart: unless-stopped
